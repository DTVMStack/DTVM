name: DTVM-EVM test CI in x86-64

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'resources/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'resources/**'
      - '*.md'
      - '.gitignore'
permissions:
    contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared FetchContent cache root for all container jobs. The hook in
# CMakeLists.txt (commit 96707a2 lines 8-18) picks this up as the base
# dir for FetchContent populations. The cache key includes the generator
# namespace because CMake writes generator-specific FetchContent subbuilds.
env:
  FETCHCONTENT_BASE_DIR: /github/home/.fetchcontent
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_GHA_VERSION: dtvm-ci-sccache-v2-gcc11-llvm15-ninja
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  SCCACHE_IDLE_TIMEOUT: "0"
  DTVM_CI_USE_NINJA: "1"
  DTVM_CI_USE_SCCACHE: "1"
  EVMONE_REPO: https://github.com/DTVMStack/evmone.git
  EVMONE_REF: for_test
  EVMONE_BENCH_CACHE_VERSION: v1

jobs:
  build_test_evm_interpreter_x86_ctest:
    name: Test DTVM-EVM interpreter with ctest on x86-64
    runs-on: ubuntu-latest
    container:
      image: dtvmdev1/dtvm-dev-x64:main
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: /github/home/.fetchcontent
          key: ${{ runner.os }}-fc-${{ github.workflow }}-ninja-v2-${{ hashFiles('third_party/AddDeps.cmake') }}
      - name: Code Format Check
        run: |
          ./tools/format.sh check
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Clone asmjit
        run: |
          git clone https://github.com/asmjit/asmjit.git
      - name: Build and Test
        run: |
          echo "current home is $HOME"
          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH
          export CMAKE_BUILD_TARGET=Debug
          export ENABLE_ASAN=true
          export RUN_MODE=interpreter
          export INPUT_FORMAT=evm
          export ENABLE_LAZY=true
          export ENABLE_MULTITHREAD=true
          export TestSuite=evmtestsuite
          export CPU_EXCEPTION_TYPE='check'
          export ENABLE_GAS_METER=false

          bash .ci/run_test_suite.sh

  build_test_release_multipass_lazy_evmtestsuite_on_x86_ctest:
    name: Test DTVM-EVM multipass in release mode with ctest on x86-64
    runs-on: ubuntu-latest
    container:
      image: dtvmdev1/dtvm-dev-x64:main
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: /github/home/.fetchcontent
          key: ${{ runner.os }}-fc-${{ github.workflow }}-ninja-v2-${{ hashFiles('third_party/AddDeps.cmake') }}
      - name: Code Format Check
        run: |
          ./tools/format.sh check
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Build and Test
        run: |
          echo "current home is $HOME"
          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH
          export CMAKE_BUILD_TARGET=Release
          export ENABLE_ASAN=true
          export RUN_MODE=multipass
          export INPUT_FORMAT=evm
          export ENABLE_LAZY=false
          export ENABLE_MULTITHREAD=true
          export TestSuite=evmtestsuite
          export CPU_EXCEPTION_TYPE='check'
          export ENABLE_GAS_METER=true

          bash .ci/run_test_suite.sh

  build_test_evm_interpreter_x86_cli:
    name: Test DTVM-EVM interpreter with CLI on x86-64
    runs-on: ubuntu-latest
    container:
      image: dtvmdev1/dtvm-dev-x64:main
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: /github/home/.fetchcontent
          key: ${{ runner.os }}-fc-${{ github.workflow }}-ninja-v2-${{ hashFiles('third_party/AddDeps.cmake') }}
      - name: Code Format Check
        run: |
          ./tools/format.sh check
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Build and Test
        run: |
          echo "current home is $HOME"
          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH
          export CMAKE_BUILD_TARGET=Debug
          export ENABLE_ASAN=true
          export RUN_MODE=interpreter
          export INPUT_FORMAT=evm
          export ENABLE_LAZY=true
          export ENABLE_MULTITHREAD=true
          export TestSuite=evmrealsuite
          export CPU_EXCEPTION_TYPE='check'
          export ENABLE_GAS_METER=false

          for attempt in 1 2 3; do
            echo "run_test_suite attempt ${attempt}/3"
            if bash .ci/run_test_suite.sh; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "run_test_suite failed after 3 attempts"
              exit 1
            fi
            echo "transient failure detected, retrying in 15s..."
            sleep 15
          done

