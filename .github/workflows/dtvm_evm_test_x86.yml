          bash .ci/run_test_suite.sh

  performance_regression_check:
    name: Performance Regression Check (${{ matrix.mode }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        mode: [interpreter, multipass]
    container:
      image: dtvmdev1/dtvm-dev-x64:main
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: /github/home/.fetchcontent
          key: ${{ runner.os }}-fc-${{ github.workflow }}-ninja-v2-${{ hashFiles('third_party/AddDeps.cmake') }}

      - name: Cache Hunter
        uses: actions/cache@v4
        with:
          path: /github/home/.hunter
          key: ${{ runner.os }}-hunter-evmone-v1-${{ hashFiles('.ci/run_test_suite.sh', '.github/workflows/dtvm_evm_test_x86.yml') }}
          restore-keys: |
            ${{ runner.os }}-hunter-evmone-v1-

      - name: Setup git safe directory
        run: |
          echo "Configuring git safe directory: ${{ github.workspace }}"
          git config --global --add safe.directory /__w/DTVM/DTVM

      - name: Code Format Check
        run: |
          ./tools/format.sh check
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Cache the BUILT baseline libdtvmapi.so (a deterministic function of
      # base.sha), not the bench output JSON (a function of source + host +
      # load). Forces every PR to re-run baseline benchmarks on the same
      # runner as the PR benchmarks via the `elif` dispatch branch in
      # .ci/run_test_suite.sh.
      - name: Restore baseline lib cache
        id: baseline-cache
        uses: actions/cache@v4
        with:
          path: /tmp/baseline_lib
          key: perf-baseline-lib-${{ matrix.mode }}-${{ github.event.pull_request.base.sha }}

      - name: Build baseline library (${{ github.base_ref }})
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        run: |
          echo "Building baseline library from branch: ${{ github.base_ref }}"

          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH

          git stash push -u -m "perf-check-stash"
          git checkout ${{ github.base_ref }}

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DZEN_ENABLE_SINGLEPASS_JIT=OFF \
            -DZEN_ENABLE_MULTIPASS_JIT=ON \
            -DZEN_ENABLE_EVM=ON \
            -DZEN_ENABLE_LIBEVM=ON \
            -DZEN_ENABLE_JIT_PRECOMPILE_FALLBACK=ON \
            -DZEN_ENABLE_CPU_EXCEPTION=ON \
            -DZEN_ENABLE_VIRTUAL_STACK=ON
          cmake --build build -j 16

          mkdir -p /tmp/baseline_lib
          # Resolve SONAME chain (libdtvmapi.so -> .0.1 -> .0.1.0) and copy
          # the real file only. Plain `cp build/lib/*` dereferences each
          # symlink and produces 3 full copies (~105 MB) plus any
          # libgtest*.a present. The dispatcher at .ci/run_test_suite.sh
          # consumes the bare name `libdtvmapi.so` only.
          cp "$(readlink -f build/lib/libdtvmapi.so)" /tmp/baseline_lib/libdtvmapi.so

          rm -rf build
          git checkout ${{ github.sha }}
          git stash pop || true

      - name: Resolve evmone benchmark commit
        id: evmone
        run: |
          EVMONE_COMMIT=$(git ls-remote "$EVMONE_REPO" "refs/heads/$EVMONE_REF" | awk '{print $1}')
          if [ -z "$EVMONE_COMMIT" ]; then
            echo "Unable to resolve $EVMONE_REPO refs/heads/$EVMONE_REF" >&2
            exit 1
          fi
          echo "commit=$EVMONE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Resolved evmone $EVMONE_REF to $EVMONE_COMMIT"

      - name: Cache evmone-bench
        uses: actions/cache@v4
        with:
          path: evmone
          key: ${{ runner.os }}-evmone-bench-${{ env.EVMONE_BENCH_CACHE_VERSION }}-${{ steps.evmone.outputs.commit }}-${{ hashFiles('.ci/run_test_suite.sh', '.github/workflows/dtvm_evm_test_x86.yml') }}

      - name: Build current PR and check regression
        id: perf-check
        run: |
          echo "Building PR branch: ${{ github.sha }}"

          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH

          rm -rf build

          export CMAKE_BUILD_TARGET=Release
          export ENABLE_ASAN=false
          export RUN_MODE=multipass
          export ENABLE_LAZY=false
          export ENABLE_MULTITHREAD=true
          export TestSuite=benchmarksuite
          export CPU_EXCEPTION_TYPE='cpu'
          export BENCHMARK_MODE=${{ matrix.mode }}
          export BENCHMARK_THRESHOLD=0.25
          export BENCHMARK_BASELINE_LIB=/tmp/baseline_lib
          export BENCHMARK_SUMMARY_FILE=/tmp/perf_summary_${{ matrix.mode }}.md
          export BENCHMARK_REPETITIONS=5
          export BENCHMARK_JOBS=3
          export EVMONE_COMMIT=${{ steps.evmone.outputs.commit }}

          bash .ci/run_test_suite.sh
        continue-on-error: true

      - name: Clean evmone cache inputs
        if: always()
        run: |
          rm -f evmone/libdtvmapi.so evmone/libdtvmapi.so.* evmone/check_performance_regression.py

      - name: Write Performance Summary
        if: always()
        run: |
          MODE="${{ matrix.mode }}"
          OUTCOME="${{ steps.perf-check.outcome }}"
          SUMMARY_FILE="/tmp/perf_summary_${MODE}.md"
          if [ "$OUTCOME" = "success" ]; then
            echo "✅ **Performance Check Passed (${MODE})**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Performance Regression Detected (${MODE})**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "_No benchmark summary available._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Save performance artifacts
        if: always()
        run: |
          mkdir -p /tmp/perf-artifacts
          echo "${{ github.event.pull_request.number }}" > /tmp/perf-artifacts/pr_number
          echo "${{ steps.perf-check.outcome }}" > /tmp/perf-artifacts/outcome
          cp "/tmp/perf_summary_${{ matrix.mode }}.md" /tmp/perf-artifacts/summary.md 2>/dev/null || \
            echo "_No benchmark summary available._" > /tmp/perf-artifacts/summary.md

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.mode }}
          path: /tmp/perf-artifacts/
          retention-days: 7

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v6
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const mode = '${{ matrix.mode }}';
            const passed = '${{ steps.perf-check.outcome }}' === 'success';
            let summary = '';
            try {
              summary = fs.readFileSync(`/tmp/perf_summary_${mode}.md`, 'utf8');
            } catch (e) {
              summary = '_No benchmark summary available._';
            }
            const icon = passed ? '✅' : '⚠️';
            const title = passed
              ? `Performance Check Passed (${mode})`
              : `Performance Regression Detected (${mode})`;
            const body = `${icon} **${title}**\n\n${summary}`;
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              core.warning(`Could not comment on PR (expected for fork PRs): ${error.message}. Results are available in the job summary above.`);
            }

      - name: Fail on regression
        if: steps.perf-check.outcome == 'failure'
        run: |
          echo "::error::Performance regression detected in ${{ matrix.mode }} mode. See logs for details."
          exit 1
