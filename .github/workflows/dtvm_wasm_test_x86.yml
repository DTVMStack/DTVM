      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Test Git clone
        run: |
          git clone https://github.com/asmjit/asmjit.git
      - name: Install llvm
        run: |
          echo "current home is $HOME"
          export CUR_PROJECT=$(pwd)
          cd /opt
          # ./install_llvm15.sh
          # ./install_rust.sh
          cd $CUR_PROJECT
          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH
          cd tests/wast/spec
          git apply ../spec.patch
          cd $CUR_PROJECT

          DTVM_CI_BUILD_JOBS=7 .ci/cmake_ci_build.sh build -- \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZEN_ENABLE_DWASM=ON \
            -DZEN_ENABLE_SINGLEPASS_JIT=ON \
            -DZEN_ENABLE_MULTIPASS_JIT=ON \
            -DZEN_ENABLE_CHECKED_ARITHMETIC=ON \
            -DZEN_ENABLE_CPU_EXCEPTION=OFF \
            -DZEN_ENABLE_EVMABI_TEST=ON \
            -DZEN_ENABLE_BUILTIN_LIBC=OFF \
            -DZEN_ENABLE_BUILTIN_ENV=OFF
          python3 .ci/print_sccache_stats.py || true
          # use dtvm to test evm abi wasm files
          # ./build/dtvm -m 2 -f call counter.wasm
